name: garanticim
description: "Test uygulaması."
publish_to: 'none'
version: 1.0.4+3

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  lottie: ^3.3.2

  # Firebase
  firebase_core: ^4.2.0
  cloud_firestore: ^6.0.3
  firebase_storage: ^13.0.3

  # Local Storage
  shared_preferences: ^2.3.3

  # Image Handling
  image_picker: ^1.1.2

  # Notifications
  timezone: ^0.10.1

  # Utilities
  intl: ^0.20.1
  uuid: ^4.5.1
  http: ^1.2.2
  flutter_screenutil: ^5.9.3

  # Monetization
  google_mobile_ads: ^6.0.0
  in_app_purchase: ^3.1.13

  # Launcher & Splash
  flutter_native_splash: ^2.4.7
  device_info_plus: ^12.2.0
  package_info_plus: ^9.0.0
  permission_handler: ^12.0.1
  flutter_local_notifications: ^19.5.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/logo.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#f2f2f7"
  color_dark: "#000000"
  image: assets/logo.png
  android_gravity: center
  ios_content_mode: center
  fullscreen: true
  android_12:
    color: "#f2f2f7"
    color_dark: "#000000"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  characters: ^1.4.1
  material_color_utilities: ^0.13.0
  meta: ^1.17.0
  package_info_plus: ^9.0.0
  test_api: ^0.7.7

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/data/categories_brands.json
    - assets/data/terms_of_service.txt
    - assets/data/privacy_policy.txt

  fonts:
    - family: SF Pro
      fonts:
        - asset: assets/fonts/SF-Pro-Display-Regular.otf
        - asset: assets/fonts/SF-Pro-Display-Bold.otf
